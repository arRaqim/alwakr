<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدونة | الوكر للتعريبات</title>
    <meta name="description" content="ملاحظات وتدوينات عن الألعاب التي نترجمها.">
    <meta name="theme-color" content="#070708">
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/wakr.css">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body class="page-blog">

    <div class="ambient"></div>
    <div class="grain"></div>

    <nav class="nav glass" aria-label="الرئيسية">
        <a class="nav__brand" href="../"><img src="../assets/logo.svg" alt="الوكر" width="30" height="30"></a>
        <a class="nav__link" href="../">الأقراص</a>
        <a class="nav__link" href="./" aria-current="page">الإصدارات</a>
        <a class="nav__link" href="../#about">من أنتم</a>
    </nav>

    <main>
        <header class="blog-head">
            <span class="pill glass hero-in"><span class="ping"></span>سجل التعريب</span>
            <h1 class="hero__title"><span class="line"><span style="--d:.1s">المدونة</span></span></h1>
            <p class="hero-in" style="--d:.35s">ملاحظات وتدوينات عن الألعاب التي نترجمها.</p>
        </header>

        <section class="wrap wrap--wide" id="articles" aria-label="المقالات">
            <div class="ledger__head reveal">
                <span>التاريخ</span>
                <span>المقالات</span>
                <span>الحالة</span>
                <span></span>
            </div>

            <ol class="ledger">
                <li class="reveal">
                    <a class="ledger__row" href="zero.html" data-peek="rgg.jpg">
                        <img class="ledger__thumb" src="rgg.jpg" alt="" loading="lazy">
                        <span class="ledger__date">30 يونيو 2026</span>
                        <span class="ledger__title">
                            كالتنين: صفر
                            <small><span lang="ja">龍が如く0</span> — أصحاب الحُسّر.</small>
                        </span>
                        <span class="state state--done">مكتمل</span>
                        <span class="ledger__go" aria-hidden="true"><i class="ico i--left"></i></span>
                    </a>
                </li>
            </ol>
        </section>
    </main>

    <div class="peek glass" aria-hidden="true"><img src="rgg.jpg" alt=""></div>

    <footer class="footer" style="margin-top: clamp(80px, 14vw, 180px)">
        <p>© 2077 نصف الحقوق محفوظة</p>
        <p>فريق تابع للرَّقيم.</p>
    </footer>

    <script src="../assets/wakr.js"></script>
</body>
</html>
